openapi: 3.0.3
info:
  title: Extern - API Documentation for room management
  description: |
    WebUntis API for extern room management
  version: 1.0.0
  contact:
    name: Untis GmbH
    url: https://www.untis.at
    email: support@untis.at
paths:
  /api/rest/extern/v1/rooms:
    get:
      summary: get a list of rooms
      operationId: getRooms
      tags:
        - room
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Sorting"
        - $ref: "#/components/parameters/Filtering"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomsResponse"
        "400":
          $ref: "#/components/responses/bad-request-v1"
        "401":
          $ref: "#/components/responses/unauthorized-v1"
        "403":
          $ref: "#/components/responses/forbidden-v1"
        "404":
          $ref: "#/components/responses/not-found-v1"
        "500":
          $ref: "#/components/responses/internal-error-v1"
  /api/rest/extern/v1/rooms/{roomId}:
    get:
      summary: get a room
      operationId: getRoomById
      tags:
        - room
      parameters:
        - in: path
          name: roomId
          required: true
          description: The id of the room to retrieve
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternRoomDto"
        "400":
          $ref: "#/components/responses/bad-request-v1"
        "401":
          $ref: "#/components/responses/unauthorized-v1"
        "403":
          $ref: "#/components/responses/forbidden-v1"
        "404":
          $ref: "#/components/responses/not-found-v1"
        "500":
          $ref: "#/components/responses/internal-error-v1"
components:
  schemas:
    Page:
      type: object
      properties:
        limit:
          type: integer
          format: int32
          default: 100
        offset:
          type: integer
          format: int32
    SortingOrder:
      enum:
        - ASC
        - DESC
    Sorting:
      type: object
      properties:
        sort:
          type: string
          default: id
        orderBy:
          $ref: "#/components/schemas/SortingOrder"
          default: ASC
    PersonInChargeUser:
      type: object
      properties:
        Id:
          type: integer
          format: int64
        externKey:
          type: string
        UUID:
          type: string
          format: uuid
        username:
          type: string
        fullName:
          type: string
          description: Name of the teacher person (first name last name title?) Check if there is a general way to format those names in WU.
    Building:
      type: object
      properties:
        id:
          type: integer
          format: int64
        shortName:
          type: string
          minLength: 1
          maxLength: 20
        longname:
          type: string
          maxLength: 255
    Department:
      type: object
      properties:
        id:
          type: integer
          format: int64
        externKey:
          type: string
          maxLength: 100
        shortName:
          type: string
          minLength: 1
          maxLength: 30
        longname:
          type: string
          maxLength: 100
    RoomType:
      type: object
      properties:
        id:
          type: integer
          format: int64
        shortName:
          type: string
          minLength: 1
          maxLength: 20
        longname:
          type: string
          maxLength: 100
    Resource:
      type: object
      description: Assigned resource
      properties:
        id:
          type: integer
          format: int64
        shortName:
          type: string
          minLength: 1
          maxLength: 30
        longname:
          type: string
          maxLength: 100
    RoomGroup:
      type: object
      description: Assigned room group
      properties:
        id:
          type: integer
          format: int64
        shortName:
          type: string
          minLength: 1
          maxLength: 20
        longname:
          type: string
          maxLength: 100
    ExternRoomDto:
      type: object
      description: External Room Data Transfer Object
      properties:
        id:
          type: integer
          format: int64
        externKey:
          type: string
          pattern: ^[^<>|\[\]]*$
          minLength: 0
          maxLength: 100
          description: External identifier of the room, unique ATTENTION - there is no uniqueness check in the WU UI
        dateLastModified:
          type: string
          format: date-time
        shortname:
          type: string
          minLength: 1
          maxLength: 20
          pattern: ^[^<>|\[\]{}]*$
          description: Room short name. Needs to be unique
        longName:
          type: string
          minLength: 0
          maxLength: 100
          pattern: ^[^<>|\[\]{}]*$
          description: Room Long Name.
        alternateName:
          type: string
          minLength: 0
          maxLength: 30
          pattern: ^[^<>|\[\]{}]*$
          description: Room alternate name.
        active:
          type: boolean
        text:
          type: string
          maxLength: 255
        capacity:
          type: integer
          minimum: 0
        capacityForExams:
          type: integer
          minimum: 0
        area:
          type: integer
          minimum: 0
        bookNoLaterThan:
          type: integer
          description: Number of seconds the booking appointment needs to be before any possible booking date
        bookingPossible:
          type: boolean
        reservationsOnly:
          type: boolean
        supervisionRequired:
          type: boolean
        personInChargeUser:
          $ref: "#/components/schemas/PersonInChargeUser"
        building:
          $ref: "#/components/schemas/Building"
        department:
          $ref: "#/components/schemas/Department"
        roomType:
          $ref: "#/components/schemas/RoomType"
        ressources:
          type: array
          description: List of assigned resources
          items:
            $ref: "#/components/schemas/Resource"
        roomGroups:
          type: array
          description: List of assigned room groups (left listbox)
          items:
            $ref: "#/components/schemas/RoomGroup"
        photo:
          type: string
          description: How easy is it to return the picture?
          nullable: true
    Rooms:
      type: array
      items:
        $ref: "#/components/schemas/ExternRoomDto"
    RoomsResponse:
      type: object
      x-no-field-selection: true
      required:
        - rooms
      properties:
        rooms:
          $ref: "#/components/schemas/Rooms"
    ErrorCode:
      type: string
      enum:
        - INTERNAL_ERROR
        - MASTER_DATA_NOT_FOUND
        - VALIDATION_ERROR
        - ENTITY_EXPIRED
        - MESSAGING_GROUP_CALCULATION_ERROR
        - MESSAGING_READ_CONFIRMATION_ALREADY_CONFIRMED
        - NOT_FOUND
        - FORBIDDEN
        - TT_ONGOING_TIMETABLE_PUBLICATION
        - TT_UNRESOLVED_CHANGESET
        - TENANT_INSTALLATION_RECOVERABLE_ERROR
        - BAD_REQUEST
        - PW_CHANGE_RULE_VIOLATION
    ErrorData:
      type: object
      properties:
        id:
          type: integer
          format: int64
        externKey:
          type: string
    ValidationError:
      type: object
      required:
        - path
        - errorMessage
      properties:
        errorKey:
          type: string
          enum:
            - field.mustBeMin
            - field.mustBeMax
            - field.mustBeNull
            - field.mustNotBeNull
            - field.mustNotBeEmpty
            - field.mustNotBeBlank
            - field.sizeInvalid
            - field.digitsMustMatch
            - field.mustBeEmail
            - field.mustBeFuture
            - field.mustBeFutureOrPresent
            - field.mustBePast
            - field.mustBePastOrPresent
            - field.mustBePositive
            - field.mustBePositiveOrZero
            - field.mustBeNegative
            - field.mustBeNegativeOrZero
            - field.mustMatchPattern
            - value.mustHaveIdentity
            - value.mustBeBefore
            - value.mustBeAfter
            - value.alreadyExists
            - value.mustBeUnique
            - value.other
            - value.mustBeIsoCountryCode
            - entity.notFound
            - entity.duplicateFound
            - entity.other
        path:
          type: string
        constraintValue:
          type: string
        errorMessage:
          type: string
        index:
          type: integer
          description: Index of the dto which failed validation in a bulk operation. Count starts from 0.
        errorData:
          type: array
          items:
            $ref: "#/components/schemas/ErrorData"
    ValidationErrorResponse:
      type: object
      required:
        - errorCode
        - requestId
        - traceId
        - validationErrors
      properties:
        errorCode:
          $ref: "#/components/schemas/ErrorCode"
        requestId:
          type: string
        traceId:
          type: string
        validationErrors:
          type: array
          items:
            $ref: "#/components/schemas/ValidationError"
    ErrorResponse:
      type: object
      required:
        - errorCode
        - errorMessage
        - requestId
        - traceId
      properties:
        errorCode:
          $ref: "#/components/schemas/ErrorCode"
        errorMessage:
          type: string
        requestId:
          type: string
        traceId:
          type: string
  parameters:
    Page:
      name: page
      in: query
      description: Page - contains values for limit and offset.
      required: true
      schema:
        $ref: "#/components/schemas/Page"
    Sorting:
      name: sorting
      in: query
      description: Sorting - contains values for sort and orderby.
      required: true
      schema:
        $ref: "#/components/schemas/Sorting"
    Filtering:
      name: filter
      in: query
      description: Filter - the filter query e.g. <data field><predicate><value>.
      required: false
      schema:
        type: string
  responses:
    bad-request-v1:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"
    unauthorized-v1:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    forbidden-v1:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    not-found-v1:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"
    internal-error-v1:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
